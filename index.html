<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VendorIQ - AI Supplier Discovery</title>
<style>
body{font-family:Arial;background:#f6f7fb;margin:0;padding:16px}
.top{background:#111827;color:#fff;padding:20px;border-radius:16px}
.top h1{margin:0;font-size:28px}
.top p{opacity:.8}
input{width:100%;padding:14px;border-radius:12px;border:1px solid #ddd;margin:14px 0;font-size:16px;box-sizing:border-box}
.card{background:#fff;padding:16px;border-radius:16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.badge{background:#dcfce7;color:#166534;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:bold}
.score{font-size:28px;font-weight:bold;color:#2563eb}
button{background:#2563eb;color:#fff;border:0;padding:12px 16px;border-radius:10px;width:100%;font-size:16px;margin-top:10px}
</style>
</head>
<body>
<div class="top">
<h1>VendorIQ 🤖</h1>
<p>AI-powered supplier discovery & intelligence</p>
<p>Agents - A2 Track | Homingo Hackathon</p>
</div>
<input id="q" placeholder="Search: Steel in Chennai, Packaging in Mumbai...">
<div id="list"></div>
<script>
const data=[
{name:"Shree Steel Traders",city:"Chennai",item:"Steel",price:"₹58 / kg",score:92,delivery:"2 Days",risk:"Low Risk"},
{name:"Apex Packaging Co",city:"Mumbai",item:"Packaging",price:"₹12 / box",score:88,delivery:"3 Days",risk:"Low Risk"},
{name:"Kaveri Plastics",city:"Coimbatore",item:"Plastic",price:"₹95 / kg",score:84,delivery:"1 Day",risk:"Medium Risk"},
{name:"Metro Electronics",city:"Delhi",item:"Electronics",price:"₹450 / unit",score:90,delivery:"4 Days",risk:"Low Risk"}
];
function show(filter=""){
  document.getElementById("list").innerHTML=data.filter(d=>(d.city+d.item+d.name).toLowerCase().includes(filter.toLowerCase())).map(d=>`
  <div class="card">
  <span class="badge">✅ ${d.risk}</span>
  <h2 style="margin:8px 0 4px">${d.name}</h2>
  <p style="margin:0;color:#666">${d.item} • ${d.city} • ${d.delivery} Delivery</p>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px">
  <div><div style="font-size:12px;color:#666">VendorIQ Score</div><div class="score">${d.score}/100</div></div>
  <div style="text-align:right"><div style="font-size:12px;color:#666">Best Price</div><b>${d.price}</b></div>
  </div>
  <button onclick="alert('AI Agent is contacting ${d.name}... Demo')">Contact via AI Agent 🤖</button>
  </div>`).join("") || "<p>No supplier found. Try Steel / Packaging</p>";
}
document.getElementById("q").addEventListener("input",e=>show(e.target.value));
show();
</script>
</body>
</html>
